# Render Blueprint for the SarkariPrep backend stack.
# Database: Supabase Postgres (external, set DATABASE_URL when prompted).
# Redis: Render Key Value (free plan, internal-only).
# API: NestJS on the native Node runtime.
# Parser: FastAPI + Tesseract on Docker.
#
# Import this file with: Render Dashboard -> New -> Blueprint -> select repo.

services:
  - type: keyvalue
    name: sarkariprep-redis
    plan: free
    region: singapore
    # Empty allow list = private network only; the API must be in the same region.
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: sarkariprep-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace=@sarkariprep/api && npm run build --workspace=@sarkariprep/api
    startCommand: npm run start --workspace=@sarkariprep/api
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sarkariprep-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PARSER_SERVICE_URL
        fromService:
          type: web
          name: sarkariprep-parser
          envVarKey: RENDER_EXTERNAL_URL
      - key: LLM_PROVIDER
        value: heuristic
      - key: INGESTION_SCHEDULER_ENABLED
        value: "false"
      - key: PARSER_TIMEOUT_MS
        value: "180000"
      - key: PARSER_STATUS_TIMEOUT_MS
        value: "15000"
      - key: MAX_UPLOAD_MB
        value: "25"

  - type: web
    name: sarkariprep-parser
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    dockerfilePath: ./apps/parser/Dockerfile
    dockerContext: ./apps/parser
    envVars:
      - key: LLM_PROVIDER
        value: heuristic
      - key: MAX_UPLOAD_MB
        value: "25"
